<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>mini2k | Editorial Catalogue & Atelier</title>
    <meta name="description" content="Discover handcrafted luxury jewelry in 18K solid gold, natural pearls, and ethically sourced gemstones. Direct atelier ordering via Instagram." />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/de8flo0fp/image/upload/e_trim/c_pad,w_180,h_180,b_rgb:FAF9F6/mini2k/branding/dsqxbpgeygt6ed5e3ulo.png" />
    <meta name="theme-color" content="#1C1C1C" />

    <!-- Open Graph (Facebook, Instagram, WhatsApp, LinkedIn, Slack, Discord…) -->
    <!-- Static, because this is a client-rendered SPA with no server-side rendering:
         most link-preview crawlers don't execute JS, so they only ever see these
         tags as shipped in the initial HTML, not the ones App.tsx sets at runtime. -->
    <meta property="og:site_name" content="mini2k" />
    <meta property="og:title" content="mini2k | Editorial Atelier" />
    <meta property="og:description" content="Pinterest-inspired fine jewelry discovery and direct atelier ordering." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&q=85&w=1600" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="1067" />
    <meta property="og:image:alt" content="mini2k — handcrafted fine jewelry" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="mini2k | Editorial Atelier" />
    <meta name="twitter:description" content="Pinterest-inspired fine jewelry discovery and direct atelier ordering." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&q=85&w=1600" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAF8F5] text-[#181816] font-sans antialiased selection:bg-[#C5A880]/30 selection:text-[#181816]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
